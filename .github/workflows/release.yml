name: Release Package

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Check versions match the tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          test "$(jq -r .version package.json)" = "$VERSION"
          test "$(jq -r .version server.json)" = "$VERSION"
          test "$(jq -r '.packages[0].version' server.json)" = "$VERSION"

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # prepublishOnly builds and runs the test suite
      # Skipped when the version is already out, so a failed run can be re-run
      - name: Publish to npm
        run: |
          if npm view "pdfmonkey-mcp-server@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "Already on npm, skipping"
          else
            npm publish --access public
          fi

      # The MCP Registry checks the version exists on npm, which can take a few minutes
      - name: Wait for npm
        run: |
          for i in $(seq 30); do
            npm view "pdfmonkey-mcp-server@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1 && exit 0
            sleep 20
          done
          echo "Version not visible on npm after 10 minutes"
          exit 1

      - name: Install mcp-publisher
        run: curl -sL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.5/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
